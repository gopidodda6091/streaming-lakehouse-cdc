name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Spark packages (Delta jars)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-3.2.1-spark-3.5.3

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (unit + replay; Kafka integration test is skipped)
        env:
          PYSPARK_PYTHON: python
        run: pytest -m "not integration"
